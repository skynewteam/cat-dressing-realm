<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1528">
<title>Realm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="manifest" href="data:application/json,{"name":"Realm","short_name":"Realm","start_url":".","display":"standalone","background_color":"%231a1528","theme_color":"%231a1528"}">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1528;--bg2:#221c35;--panel:rgba(36,30,55,.88);
  --line:rgba(180,160,220,.14);--text:#efeaf8;--dim:#9b90b5;
  --accent:#9b7ed9;--accent2:#6b8fd4;--mint:#6dcb9a;--danger:#e85d6a;--gold:#d4b06a;
  --f:system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:var(--f);background:var(--bg);color:var(--text);user-select:none}
.hidden{display:none!important}

.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 10%,rgba(110,90,180,.22),transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 20%,rgba(80,110,180,.14),transparent 50%),
    radial-gradient(ellipse 60% 45% at 50% 100%,rgba(60,40,100,.25),transparent 55%),
    linear-gradient(180deg,#1a1528 0%,#1e1830 45%,#16122a 100%);
}

#load{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s}
#load.gone{opacity:0;pointer-events:none}
.lc{text-align:center}.lcat{font-size:42px;opacity:.9}
.lt{font-size:1.2rem;font-weight:700;margin-top:10px;letter-spacing:1px}
.ls{color:var(--dim);font-size:.8rem;margin-top:6px}

#entry{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.card{
  position:relative;z-index:2;width:100%;max-width:360px;
  background:var(--panel);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;
}
.badge{font-size:.65rem;letter-spacing:2px;color:var(--accent);font-weight:700;margin-bottom:8px}
.ttl{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.tag{color:var(--dim);font-size:.8rem;margin-bottom:18px;line-height:1.45}
.fld{margin-bottom:12px;text-align:right}
.fld label{display:block;font-size:.7rem;color:var(--dim);margin-bottom:5px;font-weight:600}
.fld input{
  width:100%;padding:12px 14px;background:rgba(0,0,0,.25);
  border:1px solid var(--line);border-radius:12px;color:var(--text);
  font-size:16px;outline:none; /* 16px يمنع زوم iOS */
}
.fld input:focus{border-color:var(--accent)}
.err{font-size:.72rem;color:var(--danger);margin-top:4px;min-height:16px;opacity:0}.err.on{opacity:1}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:4px}
.av{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(0,0,0,.2);border:2px solid transparent;border-radius:12px;cursor:pointer;
}
.av.on{border-color:var(--gold);background:rgba(212,176,106,.12)}
.btn{
  width:100%;padding:13px;margin-top:8px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.dng{background:linear-gradient(135deg,#c0392b,#e85d6a)}
.btn2{padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;font-size:.85rem}

#app{position:fixed;inset:0;z-index:10;display:none;flex-direction:column}
#app.on{display:flex}

.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(26,21,40,.75);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);z-index:20;flex-shrink:0;
}
.tl{display:flex;align-items:center;gap:8px}
.mav{font-size:24px}.mn{font-weight:700;font-size:.9rem}.ms{font-size:.65rem;color:var(--mint)}
.rn{font-size:.9rem;font-weight:700;color:var(--accent)}
.ib{
  width:36px;height:36px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text);
}

/* HOME — ابحث واتصل */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;position:relative;z-index:5}
.home-card{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:22px 18px;text-align:center;
}
.home-card h2{font-size:1.05rem;margin-bottom:6px}
.home-card p{color:var(--dim);font-size:.8rem;margin-bottom:16px;line-height:1.4}
.home-card input{
  width:100%;padding:13px 14px;margin-bottom:12px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;outline:none;text-align:center;
}
.home-card input:focus{border-color:var(--accent)}

/* CALL STAGE */
#stage{
  display:none;flex:1;flex-direction:column;min-height:0;position:relative;z-index:5;background:#0d0a14;
}
#stage.on{display:flex}
.videos{
  flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:1fr;min-height:0;position:relative;
}
.videos video{
  width:100%;height:100%;object-fit:cover;background:#000;
}
#remoteVideo{grid-area:1/1}
#localVideo{
  position:absolute;width:112px;height:150px;bottom:12px;left:12px;
  border-radius:14px;border:2px solid rgba(255,255,255,.2);object-fit:cover;
  z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.45);background:#111;
}
@media(min-width:700px){
  .videos{grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  #remoteVideo{grid-area:auto;border-radius:12px}
  #localVideo{position:static;width:100%;height:100%;border-radius:12px;border:1px solid var(--line);box-shadow:none}
}

/* volume panel — اضغط على الشخص */
#volPanel{
  display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:15;background:rgba(30,24,48,.95);border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;width:min(280px,86vw);text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
#volPanel.on{display:block}
#volPanel .vp-title{font-size:.85rem;font-weight:700;margin-bottom:4px}
#volPanel .vp-sub{font-size:.72rem;color:var(--dim);margin-bottom:12px}
#volPanel input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0}
#volPanel .vp-val{font-size:.8rem;color:var(--gold);margin-bottom:10px}
#volPanel .vp-close{width:100%;padding:9px;border:none;border-radius:10px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer;font-size:.82rem}

.call-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;
  background:rgba(0,0,0,.45);padding:5px 12px;border-radius:20px;font-size:.7rem;color:var(--dim);
  pointer-events:none;white-space:nowrap;
}

/* CONTROLS */
.controls{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:12px 10px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:rgba(26,21,40,.92);border-top:1px solid var(--line);flex-shrink:0;
}
.cbtn{
  width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.07);color:var(--text);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.cbtn.off{background:rgba(232,93,106,.25);border-color:var(--danger);color:#ffb4bc}
.cbtn.on{background:rgba(109,203,154,.18);border-color:rgba(109,203,154,.4)}
.cbtn.hang{width:56px;background:var(--danger);border-color:var(--danger);color:#fff;border-radius:28px}
.cbtn.flip{background:rgba(155,126,217,.2);border-color:rgba(155,126,217,.4)}

/* mini chat during call */
#miniChat{
  display:none;position:absolute;bottom:70px;right:10px;left:10px;z-index:6;
  max-height:35%;flex-direction:column;pointer-events:none;
}
#miniChat.on{display:flex}
#miniChat .mc-msgs{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;
  pointer-events:auto;max-height:140px;padding:4px 0;
}
#miniChat .mc-row{
  align-self:flex-start;max-width:85%;background:rgba(0,0,0,.55);
  padding:6px 10px;border-radius:12px;font-size:.78rem;line-height:1.35;
}
#miniChat .mc-row.own{align-self:flex-end;background:rgba(155,126,217,.35)}
#miniChat .mc-in{
  display:flex;gap:6px;pointer-events:auto;margin-top:6px;
}
#miniChat .mc-in input{
  flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.5);color:var(--text);font-size:16px;outline:none;
}
#miniChat .mc-in button{
  padding:0 14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;
}

#incoming{
  position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));
  z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:16px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.45);
}
#incoming.on{display:block}
.ia{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ia .ico{font-size:32px}.ia small{color:var(--dim);font-size:.75rem}
.iact{display:flex;gap:8px}
.iact button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;color:#fff;font-size:.9rem}
.iact .accept{background:var(--mint);color:#0a2018}
.iact .reject{background:var(--danger)}

.mod{position:fixed;inset:0;z-index:60;background:rgba(10,8,18,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.mod.h{display:none!important}
.mbx{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:340px;padding:18px}
.mbx h2{font-size:1rem;margin-bottom:8px}
.mbx p{font-size:.82rem;color:var(--dim);margin-bottom:14px;line-height:1.4}
.ma{display:flex;gap:8px}.ma .btn,.ma .btn2{flex:1}

#toasts{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:100;display:flex;flex-direction:column;gap:6px;max-width:min(280px,80vw)}
.toast{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:.8rem;display:flex;gap:8px;align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-left:4px}
</style>
</head>
<body>
<div class="bg"></div>
<div id="load"><div class="lc"><div class="lcat">🌙</div><div class="lt">Realm</div><div class="ls">جاري التحميل...</div></div></div>

<div id="entry">
  <div class="card">
    <div class="badge">REALM</div>
    <div class="ttl">دخول</div>
    <div class="tag">اكتب اسمك، وبعدين كلّم أي حد بالاسم مباشرة.</div>
    <div class="fld">
      <label>اسمك</label>
      <input id="nick" maxlength="16" placeholder="اسمك..." autocomplete="off" enterkeyhint="done">
      <div class="err" id="nerr"></div>
    </div>
    <div class="fld">
      <label>أفاتار</label>
      <div class="avs" id="avs"></div>
    </div>
    <button class="btn" id="benter" disabled>دخول</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="tl">
      <div class="mav" id="mav">🌙</div>
      <div><div class="mn" id="mn">—</div><div class="ms"><span class="status-dot"></span>متصل</div></div>
    </div>
    <div class="rn">Realm</div>
    <button class="ib" id="bleave" title="خروج">🚪</button>
  </header>

  <!-- شاشة الاتصال -->
  <div class="home" id="home">
    <div class="home-card">
      <h2>ابدأ مكالمة</h2>
      <p>اكتب اسم الشخص بالظبط وهو يكون داخل.</p>
      <input id="callTo" maxlength="16" placeholder="اسم الشخص..." autocomplete="off" enterkeyhint="go">
      <button class="btn" id="bcall">📞 اتصال</button>
    </div>
  </div>

  <!-- شاشة المكالمة -->
  <div id="stage">
    <div class="videos" id="videos">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="call-hint" id="callHint">اضغط مطوّل على الشاشة عشان تتحكم في الصوت</div>
    </div>
    <div id="volPanel">
      <div class="vp-title" id="vpTitle">صوت الطرف</div>
      <div class="vp-sub">علّي أو وطّي صوته عندك بس</div>
      <div class="vp-val" id="vpVal">100%</div>
      <input type="range" id="volRange" min="0" max="150" value="100">
      <button class="vp-close" id="volClose">تم</button>
    </div>
    <div id="miniChat">
      <div class="mc-msgs" id="mcMsgs"></div>
      <div class="mc-in">
        <input id="mcIn" placeholder="رسالة..." maxlength="300" enterkeyhint="send">
        <button id="mcSend">➤</button>
      </div>
    </div>
    <div class="controls">
      <button class="cbtn on" id="cmute" title="مايك">🎤</button>
      <button class="cbtn on" id="cdeaf" title="ديفن">🔊</button>
      <button class="cbtn on" id="ccam" title="كاميرا">📷</button>
      <button class="cbtn flip" id="cflip" title="قلب الكاميرا">🔄</button>
      <button class="cbtn" id="cchat" title="رسائل">💬</button>
      <button class="cbtn hang" id="cleave" title="إنهاء">☎️</button>
    </div>
  </div>
</div>

<div id="incoming">
  <div class="ia">
    <div class="ico" id="incAv">📞</div>
    <div><strong id="incName">مكالمة واردة</strong><br><small>اضغط قبول للرد</small></div>
  </div>
  <div class="iact">
    <button class="accept" id="incAccept">قبول</button>
    <button class="reject" id="incReject">رفض</button>
  </div>
</div>

<div class="mod h" id="mleave">
  <div class="mbx">
    <h2>خروج؟</h2>
    <p>هتخرج من الريلم.</p>
    <div class="ma">
      <button class="btn dng" id="bcleave">خروج</button>
      <button class="btn2" data-c="mleave">بقاء</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(function(){
'use strict';
const SERVER_URL = "https://cat-dressing-server-app.vercel.app";

const S = {
  nick:'', av:'🌙',
  socket:null, pc:null, callWith:null, incomingFrom:null,
  localStream:null,
  muted:false, deaf:false, camOn:true,
  facing:'user', // user | environment
  remoteVol:1, // 0..1.5
  joined:false, heartbeat:null, makingOffer:false,
  chatOpen:false, chats:{}
};

const AVS = ['🌙','✨','🔮','🦋','🌸','🐱','🌟','💫','🧿','🪽'];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

function boot(){
  try{ setupEntry(); }catch(e){ console.error(e); }
  const loader=$('#load');
  if(loader){ loader.classList.add('gone'); setTimeout(()=>loader.remove(),400); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
else boot();

function setupEntry(){
  const row=$('#avs');
  AVS.forEach((a,i)=>{
    const e=document.createElement('div');
    e.className='av'+(i===0?' on':''); e.textContent=a;
    e.onclick=()=>{ $$('.av').forEach(x=>x.classList.remove('on')); e.classList.add('on'); S.av=a; ready(); };
    row.appendChild(e);
  });
  $('#nick').oninput=()=>{ $('#nerr').classList.remove('on'); ready(); };
  $('#nick').onkeydown=e=>{ if(e.key==='Enter'&&!$('#benter').disabled) enter(); };
  $('#benter').onclick=enter;
}
function ready(){ $('#benter').disabled=$('#nick').value.trim().length<2; }

function toast(ic,tx){
  const e=document.createElement('div'); e.className='toast';
  e.innerHTML=`<span>${ic}</span><span>${tx}</span>`;
  $('#toasts').appendChild(e); setTimeout(()=>e.remove(),3200);
}

async function requestPerms(){
  try{
    try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') await ac.resume(); await ac.close(); }catch(e){}
    // جودة منخفضة عشان الموبايل والنت الضعيف
    let s;
    try{
      s=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
        video:{facingMode:'user', width:{ideal:480}, height:{ideal:360}, frameRate:{ideal:20,max:24}}
      });
    }catch(e){
      s=await navigator.mediaDevices.getUserMedia({audio:true});
    }
    s.getTracks().forEach(t=>t.stop());
    return true;
  }catch(e){ toast('⚠️','وافق على المايك/الكاميرا'); return false; }
}

function connectRealtime(){
  if(S.socket){ try{ S.socket.removeAllListeners(); S.socket.disconnect(); }catch(e){} }
  S.socket=io(SERVER_URL,{
    transports:['websocket','polling'],
    reconnection:true, reconnectionAttempts:Infinity,
    reconnectionDelay:800, reconnectionDelayMax:5000,
    timeout:15000, forceNew:true
  });
  S.socket.on('connect',()=>{
    S.socket.emit('user:join',{name:S.nick,av:S.av});
    startHeartbeat();
    if(S.joined) toast('🔄','رجع الاتصال');
  });
  S.socket.on('disconnect',()=>{ stopHeartbeat(); if(S.joined) toast('⚠️','انقطع...'); });
  S.socket.on('user:error',m=>{ $('#nerr').textContent=m; $('#nerr').classList.add('on'); });
  S.socket.on('user:joined',()=>{
    S.joined=true;
    $('#mn').textContent=S.nick; $('#mav').textContent=S.av;
    $('#entry').style.display='none'; $('#app').classList.add('on');
    toast('✨','أهلاً '+S.nick);
  });
  // مش محتاجين قائمة صحاب — السيرفر ممكن يبعت users:list ونتجاهلها
  S.socket.on('users:list',()=>{});

  S.socket.on('chat:message',x=>{
    if(!S.chats[x.from]) S.chats[x.from]=[];
    const msg=x.message;
    S.chats[x.from].push(msg);
    if(S.callWith===x.from) appendMiniMsg(msg,false);
    else toast('💬',x.from);
  });
  S.socket.on('chat:sent',x=>{
    if(!S.chats[x.to]) S.chats[x.to]=[];
    S.chats[x.to].push(x.message);
    if(S.callWith===x.to) appendMiniMsg(x.message,true);
  });

  S.socket.on('call:incoming',x=>incomingCall(x.from));
  S.socket.on('call:accept',async x=>{ if(x.from===S.callWith) await makeOffer(); });
  S.socket.on('call:reject',x=>{ toast('📵','رفض المكالمة'); cleanupCall(false); });
  S.socket.on('call:offer',async x=>await handleOffer(x));
  S.socket.on('call:answer',async x=>{
    if(S.pc&&x.sdp){
      try{
        if(S.pc.signalingState==='have-local-offer'||!S.pc.currentRemoteDescription)
          await S.pc.setRemoteDescription(x.sdp);
      }catch(e){}
    }
  });
  S.socket.on('call:ice',async x=>{
    if(S.pc&&x.candidate) try{ await S.pc.addIceCandidate(x.candidate); }catch(e){}
  });
  S.socket.on('call:hangup',x=>{ toast('📞','المكالمة انتهت'); cleanupCall(false); });

  // لو السيرفر بيرجع invite errors لما نكلم حد مش موجود
  S.socket.on('invite:error',m=>toast('⚠️',m));
  S.socket.on('call:error',m=>toast('⚠️',m));
}

function startHeartbeat(){
  stopHeartbeat();
  S.heartbeat=setInterval(()=>{ if(S.socket?.connected) S.socket.emit('ping',{t:Date.now()}); },15000);
}
function stopHeartbeat(){ if(S.heartbeat){ clearInterval(S.heartbeat); S.heartbeat=null; } }

async function enter(){
  const n=$('#nick').value.trim().slice(0,16);
  if(n.length<2) return;
  S.nick=n;
  await requestPerms();
  connectRealtime();
}

/* ===== CALL FLOW ===== */
async function startCall(){
  const to=($('#callTo').value||'').trim().slice(0,16);
  if(!to){ toast('⚠️','اكتب الاسم'); return; }
  if(to.toLowerCase()===S.nick.toLowerCase()){ toast('⚠️','مش هتتكلم مع نفسك'); return; }
  if(!S.socket?.connected){ toast('⚠️','مش متصل'); return; }
  if(S.pc||S.callWith){ toast('⚠️','أنت في مكالمة'); return; }

  S.callWith=to;
  S.socket.emit('call:invite',{to});
  showStage();
  toast('📞','بتتصل بـ '+to+'...');
}

function incomingCall(from){
  const name=(typeof from==='object'&&from.n)?from.n:from;
  const av=(typeof from==='object'&&from.a)?from.a:'📞';
  if(S.pc||S.callWith){
    if(S.socket) S.socket.emit('call:reject',{to:name});
    return;
  }
  S.incomingFrom=name;
  $('#incAv').textContent=av;
  $('#incName').textContent=name+' بيتصل بيك';
  $('#incoming').classList.add('on');
  // اهتزاز خفيف لو متاح
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

async function acceptIncoming(){
  const from=S.incomingFrom;
  if(!from){ $('#incoming').classList.remove('on'); return; }
  $('#incoming').classList.remove('on');
  S.incomingFrom=null;
  S.callWith=from;
  try{
    if(S.pc&&(S.pc.connectionState==='closed'||S.pc.connectionState==='failed')){
      try{S.pc.close()}catch(e){} S.pc=null; S.localStream=null;
    }
    await preparePeer();
    if(!S.pc) throw new Error('no pc');
    if(S.socket) S.socket.emit('call:accept',{to:from});
    showStage();
    forceAudio();
  }catch(e){
    console.error(e);
    toast('⚠️','فشل القبول — وافق على الكاميرا/المايك');
    cleanupCall(false);
  }
}
function rejectIncoming(){
  if(S.incomingFrom&&S.socket) S.socket.emit('call:reject',{to:S.incomingFrom});
  S.incomingFrom=null;
  $('#incoming').classList.remove('on');
}

function showStage(){
  $('#home').classList.add('hidden');
  $('#stage').classList.add('on');
  updateBtns();
  // امسح رسائل الميني شات القديمة للشخص ده
  $('#mcMsgs').innerHTML='';
  S.chatOpen=false;
  $('#miniChat').classList.remove('on');
}
function hideStage(){
  $('#stage').classList.remove('on');
  $('#home').classList.remove('hidden');
  $('#volPanel').classList.remove('on');
  $('#miniChat').classList.remove('on');
  S.chatOpen=false;
}

function mediaConstraints(facing){
  return {
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },
    video:{
      facingMode:{ideal:facing||S.facing||'user'},
      width:{ideal:480,max:640},
      height:{ideal:360,max:480},
      frameRate:{ideal:20,max:24}
    }
  };
}

async function preparePeer(){
  if(S.pc && S.pc.connectionState!=='closed' && S.pc.connectionState!=='failed') return S.pc;
  if(S.pc){ try{S.pc.close()}catch(e){} S.pc=null; }

  S.pc=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'}
    ]
  });

  S.pc.onicecandidate=e=>{
    if(e.candidate&&S.socket&&S.callWith)
      S.socket.emit('call:ice',{to:S.callWith,candidate:e.candidate});
  };

  S.pc.ontrack=e=>{
    const remote=$('#remoteVideo');
    if(!remote.srcObject) remote.srcObject=new MediaStream();
    const stream=remote.srcObject;
    e.track.enabled=true;
    if(![...stream.getTracks()].find(t=>t.id===e.track.id))
      stream.addTrack(e.track);
    if(e.streams){
      e.streams.forEach(st=>st.getTracks().forEach(t=>{
        if(![...stream.getTracks()].find(x=>x.id===t.id)) stream.addTrack(t);
      }));
    }
    remote.volume=Math.min(1,S.remoteVol);
    // للقيم فوق 100% نستخدم gain
    applyRemoteVolume();
    remote.play().catch(()=>{});
  };

  S.pc.onconnectionstatechange=()=>{
    if(!S.pc) return;
    const st=S.pc.connectionState;
    if(st==='connected'){
      toast('✅','اتصلت');
      forceAudio();
      S.pc.getSenders().forEach(s=>{
        if(s.track?.kind==='audio') s.track.enabled=!S.muted;
      });
    }
    if(st==='failed'){ toast('⚠️','فشل الاتصال'); cleanupCall(true); }
    if(st==='closed') cleanupCall(false);
  };

  try{
    S.localStream=await navigator.mediaDevices.getUserMedia(mediaConstraints(S.facing));
  }catch(e){
    try{
      S.localStream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
        video:false
      });
      S.camOn=false;
    }catch(err){
      toast('⚠️','لازم توافق على المايك');
      cleanupCall(false);
      throw err;
    }
  }

  // خفّض بتريت الفيديو لو الإرسال متاح
  S.localStream.getTracks().forEach(t=>{
    t.enabled=true;
    S.pc.addTrack(t,S.localStream);
  });
  try{
    const vs=S.pc.getSenders().find(s=>s.track?.kind==='video');
    if(vs && vs.setParameters){
      const p=vs.getParameters();
      if(!p.encodings) p.encodings=[{}];
      p.encodings[0].maxBitrate=350000; // ~350kbps خفيف للموبايل
      p.encodings[0].maxFramerate=20;
      await vs.setParameters(p);
    }
  }catch(e){}

  S.muted=false; S.deaf=false;
  $('#localVideo').srcObject=S.localStream;
  $('#localVideo').muted=true;
  $('#remoteVideo').srcObject=new MediaStream();
  updateBtns();
  return S.pc;
}

async function makeOffer(){
  if(S.makingOffer) return;
  S.makingOffer=true;
  try{
    await preparePeer();
    if(!S.pc) return;
    const offer=await S.pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true});
    await S.pc.setLocalDescription(offer);
    if(S.socket&&S.callWith)
      S.socket.emit('call:offer',{to:S.callWith,sdp:S.pc.localDescription});
  }catch(e){ console.error(e); toast('⚠️','فشل إنشاء المكالمة'); }
  finally{ S.makingOffer=false; }
}

async function handleOffer(x){
  try{
    const isRene=!!S.pc&&!!S.callWith&&S.callWith===x.from;
    if(!S.pc||S.pc.connectionState==='closed'||S.pc.connectionState==='failed'){
      S.pc=null; S.callWith=x.from; await preparePeer();
    }else if(!S.callWith) S.callWith=x.from;
    if(!S.pc) return;
    if(S.pc.signalingState==='have-local-offer'){
      try{ await S.pc.setLocalDescription({type:'rollback'}); }catch(e){}
    }
    await S.pc.setRemoteDescription(x.sdp);
    const answer=await S.pc.createAnswer();
    await S.pc.setLocalDescription(answer);
    if(S.socket) S.socket.emit('call:answer',{to:S.callWith||x.from,sdp:S.pc.localDescription});
    if(!isRene) showStage();
    forceAudio();
  }catch(e){
    console.error(e);
    toast('⚠️','فشل استقبال المكالمة');
    if(!S.callWith) cleanupCall(false);
  }
}

function cleanupCall(notify){
  if(notify&&S.callWith&&S.socket?.connected){
    try{ S.socket.emit('call:hangup',{to:S.callWith}); }catch(e){}
  }
  if(S.localStream){ S.localStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}}); S.localStream=null; }
  if(S.pc){ try{S.pc.close()}catch(e){} S.pc=null; }
  if(S._gainCtx){ try{S._gainCtx.close()}catch(e){} S._gainCtx=null; S._gainNode=null; }
  $('#localVideo').srcObject=null;
  $('#remoteVideo').srcObject=null;
  hideStage();
  S.callWith=null; S.incomingFrom=null;
  S.muted=false; S.deaf=false; S.camOn=true;
  S.makingOffer=false; S.facing='user';
  $('#incoming').classList.remove('on');
}

/* ===== VOLUME CONTROL (صوت الطرف عندك بس) ===== */
function applyRemoteVolume(){
  const remote=$('#remoteVideo');
  if(!remote) return;
  const v=S.remoteVol;
  // video.volume max 1 — لو عايز أعلى من 100% نستخدم WebAudio
  if(v<=1){
    remote.volume=S.deaf?0:v;
    remote.muted=!!S.deaf;
    if(S._gainNode) S._gainNode.gain.value=0; // متعملش مضاعفة
  }else{
    remote.volume=S.deaf?0:1;
    remote.muted=true; // هنسمّع من الـ gain بس عشان منضاعفش
    ensureGainFromRemote();
    if(S._gainNode) S._gainNode.gain.value=S.deaf?0:v;
  }
  $('#vpVal').textContent=Math.round(v*100)+'%';
  $('#volRange').value=Math.round(v*100);
}

function ensureGainFromRemote(){
  try{
    const remote=$('#remoteVideo');
    if(!remote?.srcObject) return;
    if(!S._gainCtx){
      S._gainCtx=new (window.AudioContext||window.webkitAudioContext)();
      S._gainNode=S._gainCtx.createGain();
      S._gainNode.connect(S._gainCtx.destination);
    }
    if(S._gainCtx.state==='suspended') S._gainCtx.resume();
    if(!S._gainSrc){
      S._gainSrc=S._gainCtx.createMediaStreamSource(remote.srcObject);
      S._gainSrc.connect(S._gainNode);
    }
  }catch(e){ console.warn('gain',e); }
}

function forceAudio(){
  const remote=$('#remoteVideo');
  if(remote){ remote.play().catch(()=>{}); }
  applyRemoteVolume();
  try{ if(S._gainCtx?.state==='suspended') S._gainCtx.resume(); }catch(e){}
}

function openVolPanel(){
  if(!S.callWith) return;
  $('#vpTitle').textContent='صوت '+(S.callWith||'الطرف');
  $('#volPanel').classList.add('on');
  applyRemoteVolume();
}

/* ===== CONTROLS ===== */
function updateBtns(){
  const m=$('#cmute');
  if(S.muted){ m.textContent='🔇'; m.classList.add('off'); m.classList.remove('on'); }
  else{ m.textContent='🎤'; m.classList.remove('off'); m.classList.add('on'); }
  const d=$('#cdeaf');
  if(S.deaf){ d.textContent='🔇'; d.classList.add('off'); d.classList.remove('on'); }
  else{ d.textContent='🔊'; d.classList.remove('off'); d.classList.add('on'); }
  const c=$('#ccam');
  if(S.camOn){ c.textContent='📷'; c.classList.remove('off'); c.classList.add('on'); }
  else{ c.textContent='🚫'; c.classList.add('off'); c.classList.remove('on'); }
}

function toggleMute(){
  S.muted=!S.muted;
  if(S.pc) S.pc.getSenders().forEach(s=>{ if(s.track?.kind==='audio') s.track.enabled=!S.muted; });
  if(S.localStream) S.localStream.getAudioTracks().forEach(t=>t.enabled=!S.muted);
  updateBtns();
}
function toggleDeaf(){
  S.deaf=!S.deaf;
  applyRemoteVolume();
  updateBtns();
}
function toggleCam(){
  if(!S.localStream) return;
  const vids=S.localStream.getVideoTracks();
  if(!vids.length){ toast('⚠️','مفيش كاميرا'); return; }
  S.camOn=!S.camOn;
  vids.forEach(t=>t.enabled=S.camOn);
  updateBtns();
}

async function flipCamera(){
  if(!S.pc||!S.localStream) return;
  const next=S.facing==='user'?'environment':'user';
  try{
    const newStream=await navigator.mediaDevices.getUserMedia(mediaConstraints(next));
    const newVid=newStream.getVideoTracks()[0];
    if(!newVid) throw new Error('no video');
    const sender=S.pc.getSenders().find(s=>s.track?.kind==='video');
    if(sender) await sender.replaceTrack(newVid);
    // وقف القديم القديم
    S.localStream.getVideoTracks().forEach(t=>{ try{t.stop()}catch(e){} });
    // ادمج الأوديو القديم مع الفيديو الجديد
    const audioTracks=S.localStream.getAudioTracks();
    const mixed=new MediaStream([...audioTracks, newVid]);
    // وقف أي تراك زيادة من newStream audio لو موجود
    newStream.getAudioTracks().forEach(t=>t.stop());
    S.localStream=mixed;
    S.facing=next;
    S.camOn=true;
    $('#localVideo').srcObject=S.localStream;
    $('#localVideo').muted=true;
    updateBtns();
    toast('🔄', next==='user'?'كاميرا أمامية':'كاميرا خلفية');
  }catch(e){
    console.warn(e);
    toast('⚠️','مش قادر يقلب الكاميرا على الجهاز ده');
  }
}

/* ===== MINI CHAT ===== */
function appendMiniMsg(m,own){
  const box=$('#mcMsgs');
  if(!box) return;
  const text=typeof m==='object'?(m.text||''):String(m||'');
  if(!text) return;
  const row=document.createElement('div');
  row.className='mc-row'+(own?' own':'');
  row.textContent=text;
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
}
function sendMini(){
  if(!S.callWith||!S.socket?.connected) return;
  const t=$('#mcIn').value.trim();
  if(!t) return;
  S.socket.emit('chat:message',{to:S.callWith,message:t});
  $('#mcIn').value='';
}
function toggleChat(){
  S.chatOpen=!S.chatOpen;
  $('#miniChat').classList.toggle('on',S.chatOpen);
  if(S.chatOpen) $('#mcIn').focus();
}

function leave(){
  stopHeartbeat();
  if(S.socket) try{S.socket.disconnect()}catch(e){}
  cleanupCall(false);
  S.joined=false; S.chats={};
  $('#mleave').classList.add('h');
  $('#app').classList.remove('on');
  $('#entry').style.display='';
  $('#nick').value='';
  ready();
}

/* EVENTS */
$('#bcall').onclick=startCall;
$('#callTo').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); startCall(); } };
$('#incAccept').onclick=acceptIncoming;
$('#incReject').onclick=rejectIncoming;
$('#cmute').onclick=toggleMute;
$('#cdeaf').onclick=toggleDeaf;
$('#ccam').onclick=toggleCam;
$('#cflip').onclick=flipCamera;
$('#cchat').onclick=toggleChat;
$('#cleave').onclick=()=>cleanupCall(true);
$('#bleave').onclick=()=>$('#mleave').classList.remove('h');
$('#bcleave').onclick=leave;
$('#mcSend').onclick=sendMini;
$('#mcIn').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMini(); } };

$('#volRange').oninput=()=>{
  S.remoteVol=Number($('#volRange').value)/100;
  applyRemoteVolume();
};
$('#volClose').onclick=()=>$('#volPanel').classList.remove('on');

// اضغط مطوّل / كلك يمين على فيديو الريموت لفتح الصوت
(function(){
  const remote=$('#remoteVideo');
  let timer=null;
  remote.addEventListener('contextmenu',e=>{ e.preventDefault(); openVolPanel(); });
  remote.addEventListener('touchstart',e=>{
    timer=setTimeout(()=>openVolPanel(),450);
  },{passive:true});
  remote.addEventListener('touchend',()=>{ if(timer) clearTimeout(timer); });
  remote.addEventListener('touchmove',()=>{ if(timer) clearTimeout(timer); });
  remote.addEventListener('click',e=>{
    // دبل كلك يفتح كمان
  });
  remote.addEventListener('dblclick',e=>{ e.preventDefault(); openVolPanel(); });
})();

$$('[data-c]').forEach(b=>b.onclick=()=>{ const id=b.dataset.c; if(id) $('#'+id).classList.add('h'); });
$$('.mod').forEach(m=>m.onclick=e=>{ if(e.target===m) m.classList.add('h'); });

// منع السكرول على الموبايل
document.addEventListener('touchmove',e=>{
  if(e.target.closest('.mc-msgs')) return;
  if(e.target.closest('#volPanel')) return;
},{passive:false});

})();
</script>
